# Patch: SS (Claude Code), Sep 2026 — push retries + fail loudly, and
# dispatch deploy_web.yml after each data commit (live site was frozen on
# 21 May 2026 data because GITHUB_TOKEN pushes never trigger other workflows).

name: SawitSense MPOB Scraper

on:
  schedule:
    # 8:30am MYT (00:30 UTC) and 4:30pm MYT (08:30 UTC), Mon-Fri
    - cron: '30 0 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write  # commit data/ JSON
  issues: write    # auto-file alert on consecutive failures
  actions: write   # dispatch deploy_web.yml after a data commit

concurrency:
  group: sawitsense-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Hash-locked and wheels-only: this job can write to the repo, so it
        # installs nothing unverified and runs no package setup scripts.
        run: |
          cd backend
          pip install --require-hashes --only-binary :all: -r requirements.lock

      - name: Run scraper
        id: run_scraper
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SA_KEY }}
          COMMODITIES_API_KEY: ${{ secrets.COMMODITIES_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd backend
          python run_scraper.py

      - name: Commit data files (JSON fallback)
        id: commit
        if: always()
        run: |
          git config user.name 'SawitSense Bot'
          git config user.email 'bot@sawitsense.dev'
          git add backend/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry transient push errors instead of swallowing them: on
          # 2026-09-29 GitHub answered HTTP 500 and the old `git push || true`
          # dropped that update without any alert.
          for attempt in 1 2 3; do
            if git push; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 15))
            git pull --rebase origin main
          done
          echo "::error::Could not push the data commit after 3 attempts."
          exit 1

      - name: Deploy the new data to the live site
        # Pushes made with GITHUB_TOKEN never start other workflows, so the
        # `push` trigger in deploy_web.yml cannot fire for these bot commits;
        # workflow_dispatch is the documented exception.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_web.yml --repo "${{ github.repository }}" --ref main

      - name: Check data-quality warnings
        # run_scraper.py lists self-check problems (e.g. OER figures that
        # don't reconcile with MPOB's totals, or a missing source) in
        # latest.json's `warnings`. The data is already published with safe
        # fallbacks; failing here only raises the alert issue below.
        run: |
          python - <<'EOF'
          import json, sys
          with open("backend/data/latest.json", encoding="utf-8") as f:
              warnings = json.load(f).get("warnings") or []
          for w in warnings:
              print(f"::error::{w}")
          sys.exit(1 if warnings else 0)
          EOF

      - name: Open alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[scraper] SawitSense MPOB scraper failed: ${context.runId}`;
            const body = [
              `The scheduled SawitSense scraper run \`${context.runId}\` failed.`,
              ``,
              `- Workflow: \`${context.workflow}\``,
              `- Triggered by: \`${context.eventName}\``,
              `- Time (UTC): \`${new Date().toISOString()}\``,
              `- Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Likely causes to check first:`,
              `1. MPOC daily-prices page structure changed (\`scrapers/mpoc_cpo.py\`).`,
              `2. MPOB Prestasi Sawit OER API contract changed (\`scrapers/mpob_oer.py\`).`,
              `3. A data-quality self-check failed (see the run's error annotations).`,
              `4. The data commit could not be pushed, or the deploy could not be dispatched.`,
              `5. Network/runner outage.`,
              ``,
              `This issue was auto-filed by the workflow's failure-alert step to`,
              `prevent silent decay. Close once the next scheduled run succeeds.`,
              ``,
              `cc @creator35lwb-web`,
            ].join('\n');

            // Avoid spamming: skip if an open alert issue already exists.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper-alert',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              core.info(`Existing open scraper-alert issue #${existing.data[0].number} \u2014 not filing a duplicate.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scraper-alert', 'bug', 'automated'],
            });
