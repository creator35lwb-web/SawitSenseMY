# Flutter Web Build & Deploy to GitHub Pages
#
# Builds the Flutter Web app and deploys to GitHub Pages.
# Triggered on push to main (frontend/ or deploy changes), manual dispatch,
# or dispatch from scraper_cron.yml after each data commit. The
# `backend/data/**` path below only fires for human pushes: bot commits made
# with GITHUB_TOKEN never trigger workflows, which is why the scraper
# dispatches this workflow explicitly.
#
# Author: QQ (Qoder CSO)
# Patch: SS (Claude Code), Sep 2026 — redeploy when this file changes, and
# open an alert issue when a deploy fails.

name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/data/**'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run tests
        working-directory: frontend
        run: flutter test

      - name: Build for web
        working-directory: frontend
        run: flutter build web --release --base-href "/SawitSenseMY/"

      - name: Copy backend data for static fallback
        run: |
          mkdir -p frontend/build/web/data
          if [ -d "backend/data" ]; then
            cp -r backend/data/* frontend/build/web/data/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert:
    name: Open alert issue on failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-alert',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              core.info(`Existing open deploy-alert issue #${existing.data[0].number} — not filing a duplicate.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[deploy] Live site deploy failed: ${context.runId}`,
              body: [
                `Deploy run \`${context.runId}\` failed, so the live site is still serving the previous build and data.`,
                ``,
                `- Triggered by: \`${context.eventName}\``,
                `- Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Check the \`flutter test\` and \`flutter build web\` steps first.`,
                `Close this issue once a deploy succeeds.`,
                ``,
                `cc @creator35lwb-web`,
              ].join('\n'),
              labels: ['deploy-alert', 'bug', 'automated'],
            });
